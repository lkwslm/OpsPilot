name: opspilot-phase0

x-runtime-environment: &runtime-environment
  A2A_PROTOCOL: "1.0"
  CHAT_MODEL_ID: deepseek-v4-flash
  EMBEDDING_MODEL_ID: embedding-bge-small-zh-v1.5
  RERANK_MODEL_ID: reranker-bge-v2-m3
  SOURCE_COMMIT: 60e76fb30ef84d2d0b1bc714c3e56ca60fb0ed1b
  JDBC_URL: jdbc:postgresql://postgres:5432/opspilot
  EXPECTED_FLYWAY_VERSION: "18"
  EXPECTED_PGVECTOR_VERSION: "0.8.4"

x-process-common: &process-common
  restart: unless-stopped
  tmpfs:
    - /tmp:size=16m,noexec,nosuid
  security_opt:
    - no-new-privileges:true
  networks:
    - opspilot-backend
  depends_on:
    db-migrate:
      condition: service_completed_successfully
  volumes:
    - type: bind
      source: ./agent-input
      target: /datasets/input
      read_only: true
    - type: bind
      source: ./agents/agent-directory.yaml
      target: /app/config/agent-directory.yaml
      read_only: true
  healthcheck:
    test: ["CMD-SHELL", "java -XX:-UsePerfData -cp '/app/opspilot-server.jar:/app/lib/*' io.github.opspilot.server.Phase0Process probe http://127.0.0.1:$${SERVER_PORT}/actuator/health/readiness"]
    interval: 2s
    timeout: 2s
    retries: 20
    start_period: 2s

services:
  postgres:
    image: pgvector/pgvector@sha256:ad2e18408bf447f62092a8a5259e7df10505c5a0360bd1a1853ac8b8b0763da2
    restart: unless-stopped
    environment:
      POSTGRES_DB: opspilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-bootstrap-password
      OPSPILOT_MIGRATOR_PASSWORD_FILE: /run/secrets/migrator-db-password
      OPSPILOT_APP_PASSWORD_FILE: /run/secrets/runtime-db-password
      SAMPLE_APP_PASSWORD_FILE: /run/secrets/runtime-db-password
      FAULT_LAB_PASSWORD_FILE: /run/secrets/runtime-db-password
      EVALUATION_PASSWORD_FILE: /run/secrets/runtime-db-password
      EVIDENCE_AGENT_PASSWORD_FILE: /run/secrets/runtime-db-password
      CODE_AGENT_PASSWORD_FILE: /run/secrets/runtime-db-password
      KNOWLEDGE_AGENT_PASSWORD_FILE: /run/secrets/runtime-db-password
      DIAGNOSIS_AGENT_PASSWORD_FILE: /run/secrets/runtime-db-password
      REMEDIATION_AGENT_PASSWORD_FILE: /run/secrets/runtime-db-password
    secrets:
      - postgres-bootstrap-password
      - migrator-db-password
      - runtime-db-password
    volumes:
      - type: bind
        source: ./postgres/init
        target: /docker-entrypoint-initdb.d
        read_only: true
      - opspilot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opspilot"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [opspilot-backend]

  db-migrate:
    image: opspilot-phase0:0.1.0
    build:
      context: ..
      dockerfile: deployment/Dockerfile.phase0
      target: ops-runtime
    command: ["migrate"]
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks:
      - opspilot-backend
    environment:
      JDBC_URL: jdbc:postgresql://postgres:5432/opspilot
      MIGRATOR_USERNAME: opspilot_migrator
      MIGRATOR_PASSWORD_FILE: /run/secrets/migrator-db-password
      FLYWAY_LOCATIONS: filesystem:/app/migrations
    secrets: [migrator-db-password]
    depends_on:
      postgres:
        condition: service_healthy

  retrieval-model-probe:
    image: opspilot-phase0:0.1.0
    profiles: ["phase0-gate"]
    command: ["retrieval-gate"]
    restart: "no"
    environment:
      <<: *runtime-environment
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - opspilot-backend

  opspilot-server:
    <<: *process-common
    image: opspilot-product:0.1.0
    build:
      context: ..
      dockerfile: deployment/Dockerfile.phase0
      target: product-runtime
    networks:
      - opspilot-backend
      - opspilot-frontend
    ports:
      - "127.0.0.1:8080:8080"
    expose: ["8080"]
    environment:
      <<: *runtime-environment
      AGENT_ID: supervisor
      AGENT_SKILL: supervise-incident
      SERVICE_IDENTITY: svc:opspilot-server
      SERVER_PORT: "8080"
      DB_ROLE: opspilot_app_role
      DB_USERNAME: opspilot_app_login
      DB_PASSWORD_FILE: /run/secrets/runtime-db-password
      A2A_BASE_URL: http://opspilot-server:8080
      SERVICE_TOKEN_FILE: /run/secrets/supervisor-service-token
      DIRECTORY_PATH: /app/config/agent-directory.yaml
      EVIDENCE_AGENT_TOKEN_FILE: /run/secrets/evidence-agent-token
      CHAT_MODEL_BASE_URL: https://api.deepseek.com
      CHAT_MODEL_API_KEY_FILE: /run/secrets/deepseek-api-key
      READINESS_URLS: http://evidence-agent:8081/.well-known/agent-card.json,http://code-agent:8082/.well-known/agent-card.json,http://knowledge-agent:8083/.well-known/agent-card.json,http://diagnosis-agent:8084/.well-known/agent-card.json,http://remediation-agent:8085/.well-known/agent-card.json
    secrets:
      - supervisor-service-token
      - evidence-agent-token
      - runtime-db-password
      - deepseek-api-key
    volumes:
      - type: bind
        source: ./agent-input
        target: /datasets/input
        read_only: true
      - type: bind
        source: ./agents/agent-directory.yaml
        target: /app/config/agent-directory.yaml
        read_only: true

  evidence-agent:
    <<: *process-common
    image: opspilot-agent:0.1.0
    build:
      context: ..
      dockerfile: deployment/Dockerfile.phase0
      target: agent-runtime
    expose: ["8081"]
    environment:
      <<: *runtime-environment
      AGENT_ID: evidence-collector
      AGENT_SKILL: collect-observability-evidence
      SERVICE_IDENTITY: svc:evidence-agent
      SERVER_PORT: "8081"
      DB_ROLE: evidence_agent_role
      DB_USERNAME: evidence_agent_login
      DB_PASSWORD_FILE: /run/secrets/runtime-db-password
      A2A_BASE_URL: http://evidence-agent:8081
      SERVICE_TOKEN_FILE: /run/secrets/evidence-agent-token
      DIRECTORY_PATH: /app/config/agent-directory.yaml
      SOURCE_PATH: /datasets/input/observability.jsonl
    secrets: [evidence-agent-token, runtime-db-password]

  code-agent:
    <<: *process-common
    image: opspilot-agent:0.1.0
    build:
      context: ..
      dockerfile: deployment/Dockerfile.phase0
      target: agent-runtime
    expose: ["8082"]
    environment:
      <<: *runtime-environment
      AGENT_ID: code-analysis
      AGENT_SKILL: analyze-code-location
      SERVICE_IDENTITY: svc:code-agent
      SERVER_PORT: "8082"
      DB_ROLE: code_agent_role
      DB_USERNAME: code_agent_login
      DB_PASSWORD_FILE: /run/secrets/runtime-db-password
      A2A_BASE_URL: http://code-agent:8082
      SERVICE_TOKEN_FILE: /run/secrets/code-agent-token
      DIRECTORY_PATH: /app/config/agent-directory.yaml
    secrets: [code-agent-token, runtime-db-password]

  knowledge-agent:
    <<: *process-common
    image: opspilot-agent:0.1.0
    build:
      context: ..
      dockerfile: deployment/Dockerfile.phase0
      target: agent-runtime
    expose: ["8083"]
    environment:
      <<: *runtime-environment
      AGENT_ID: knowledge
      AGENT_SKILL: retrieve-incident-knowledge
      SERVICE_IDENTITY: svc:knowledge-agent
      SERVER_PORT: "8083"
      DB_ROLE: knowledge_agent_role
      DB_USERNAME: knowledge_agent_login
      DB_PASSWORD_FILE: /run/secrets/runtime-db-password
      A2A_BASE_URL: http://knowledge-agent:8083
      SERVICE_TOKEN_FILE: /run/secrets/knowledge-agent-token
      DIRECTORY_PATH: /app/config/agent-directory.yaml
    secrets: [knowledge-agent-token, runtime-db-password]

  diagnosis-agent:
    <<: *process-common
    image: opspilot-agent:0.1.0
    build:
      context: ..
      dockerfile: deployment/Dockerfile.phase0
      target: agent-runtime
    expose: ["8084"]
    environment:
      <<: *runtime-environment
      AGENT_ID: diagnosis
      AGENT_SKILL: generate-and-verify-hypotheses
      SERVICE_IDENTITY: svc:diagnosis-agent
      SERVER_PORT: "8084"
      DB_ROLE: diagnosis_agent_role
      DB_USERNAME: diagnosis_agent_login
      DB_PASSWORD_FILE: /run/secrets/runtime-db-password
      A2A_BASE_URL: http://diagnosis-agent:8084
      SERVICE_TOKEN_FILE: /run/secrets/diagnosis-agent-token
      DIRECTORY_PATH: /app/config/agent-directory.yaml
    secrets: [diagnosis-agent-token, runtime-db-password]

  remediation-agent:
    <<: *process-common
    image: opspilot-agent:0.1.0
    build:
      context: ..
      dockerfile: deployment/Dockerfile.phase0
      target: agent-runtime
    expose: ["8085"]
    environment:
      <<: *runtime-environment
      AGENT_ID: remediation
      AGENT_SKILL: propose-remediation
      SERVICE_IDENTITY: svc:remediation-agent
      SERVER_PORT: "8085"
      DB_ROLE: remediation_agent_role
      DB_USERNAME: remediation_agent_login
      DB_PASSWORD_FILE: /run/secrets/runtime-db-password
      A2A_BASE_URL: http://remediation-agent:8085
      SERVICE_TOKEN_FILE: /run/secrets/remediation-agent-token
      DIRECTORY_PATH: /app/config/agent-directory.yaml
    secrets: [remediation-agent-token, runtime-db-password]

  jaeger-v1:
    image: jaegertracing/all-in-one@sha256:6279882637ae03e70f519965d2ba5ca84cb785f4baf4f0d7237e827a37c33a42
    restart: unless-stopped
    command: ["--memory.max-traces=10000"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    expose: ["16686", "4317"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:16686/api/services >/dev/null"]
      interval: 3s
      timeout: 2s
      retries: 30
    networks: [opspilot-backend]

  jaeger-v2:
    image: jaegertracing/jaeger@sha256:46a886260e04002d8f45e213fc39063fa11a50446048fdaa64786fc0840cb9f8
    profiles: ["jaeger-v2"]
    restart: unless-stopped
    expose: ["16686", "4317"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:16686/api/services >/dev/null"]
      interval: 3s
      timeout: 2s
      retries: 30
    networks: [opspilot-backend]

  otel-collector:
    image: otel/opentelemetry-collector-contrib@sha256:1ab0baba0ee3695d823c46653d8a6e8894896e668ce8bd7ebe002e948d827bc7
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - type: bind
        source: ${OTEL_COLLECTOR_CONFIG:-./otel-collector/config-v1.yaml}
        target: /etc/otelcol-contrib/config.yaml
        read_only: true
    expose: ["4317", "4318", "8888", "13133"]
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [opspilot-backend]

  prometheus:
    image: prom/prometheus@sha256:9abc6cf6aea7710d163dbb28d8eeb7dc5baef01e38fa4cd146a406dd9f07f70d
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2h
      - --storage.tsdb.retention.size=512MB
      - --web.enable-lifecycle
    volumes:
      - type: bind
        source: ./prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
    expose: ["9090"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready >/dev/null"]
      interval: 3s
      timeout: 2s
      retries: 30
    networks: [opspilot-backend]

  inventory-service:
    image: opspilot-inventory-service:0.1.0
    build:
      context: ../sample-system/inventory-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/opspilot?currentSchema=sample
      DB_USERNAME: sample_app_login
      DB_PASSWORD_FILE: /run/secrets/runtime-db-password
      SPRING_PROFILES_ACTIVE: ${SAMPLE_PROFILE:-production}
      MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: readinessState,db
      OTEL_SERVICE_NAME: inventory-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    secrets: [runtime-db-password]
    expose: ["8080"]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness >/dev/null"]
      interval: 3s
      timeout: 2s
      retries: 30
    networks: [opspilot-backend]

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    restart: unless-stopped
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - type: bind
        source: ./toxiproxy/toxiproxy.json
        target: /config/toxiproxy.json
        read_only: true
    expose: ["8474", "8666"]
    depends_on:
      inventory-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "-h", "127.0.0.1:8474", "list"]
      interval: 3s
      timeout: 2s
      retries: 20
    networks: [opspilot-backend]

  order-service:
    image: opspilot-order-service:0.1.0
    build:
      context: ../sample-system/order-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/opspilot?currentSchema=sample
      DB_USERNAME: sample_app_login
      DB_PASSWORD_FILE: /run/secrets/runtime-db-password
      INVENTORY_BASE_URL: http://toxiproxy:8666
      SPRING_PROFILES_ACTIVE: ${SAMPLE_PROFILE:-production}
      MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: readinessState,db
      OTEL_SERVICE_NAME: order-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    secrets: [runtime-db-password]
    expose: ["8080"]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      toxiproxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness >/dev/null"]
      interval: 3s
      timeout: 2s
      retries: 30
    networks: [opspilot-backend]

  sample-gateway:
    image: opspilot-sample-gateway:0.1.0
    build:
      context: ../sample-system/sample-gateway
    restart: unless-stopped
    environment:
      ORDER_BASE_URL: http://order-service:8080
      INVENTORY_BASE_URL: http://toxiproxy:8666
      OTEL_SERVICE_NAME: sample-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    ports: ["127.0.0.1:8090:8080"]
    depends_on:
      order-service:
        condition: service_healthy
      toxiproxy:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness >/dev/null"]
      interval: 3s
      timeout: 2s
      retries: 30
    networks: [opspilot-backend, opspilot-frontend]

  observability-smoke:
    image: opspilot-phase0:0.1.0
    build:
      context: ..
      dockerfile: deployment/Dockerfile.phase0
    profiles: ["phase4-smoke"]
    command: ["phase4-smoke"]
    restart: "no"
    read_only: true
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      JAEGER_MODE: ${JAEGER_MODE:-v1}
      JAEGER_V1_URL: http://jaeger-v1:16686
      JAEGER_V2_URL: http://jaeger-v2:16686
      PHASE4_EVIDENCE_DIR: /evidence
    volumes:
      - type: bind
        source: ${PHASE4_EVIDENCE_HOST_DIR:-../.tmp/phase4-smoke}
        target: /evidence
      - type: bind
        source: ./
        target: /config
        read_only: true
    depends_on:
      sample-gateway:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    networks: [opspilot-backend]

networks:
  opspilot-backend:
    internal: true
  opspilot-frontend:

secrets:
  postgres-bootstrap-password:
    file: ../.tmp/secrets/postgres-bootstrap-password.txt
  migrator-db-password:
    file: ../.tmp/secrets/migrator-db-password.txt
  runtime-db-password:
    file: ../.tmp/secrets/runtime-db-password.txt
  supervisor-service-token:
    file: ../.tmp/secrets/supervisor-service-token.txt
  evidence-agent-token:
    file: ../.tmp/secrets/evidence-agent-token.txt
  code-agent-token:
    file: ../.tmp/secrets/code-agent-token.txt
  knowledge-agent-token:
    file: ../.tmp/secrets/knowledge-agent-token.txt
  diagnosis-agent-token:
    file: ../.tmp/secrets/diagnosis-agent-token.txt
  remediation-agent-token:
    file: ../.tmp/secrets/remediation-agent-token.txt
  deepseek-api-key:
    file: ../.tmp/secrets/deepseek-api-key.txt

volumes:
  opspilot-postgres-data:
