services:
  phase8-fixture-init:
    image: opspilot-fault-lab:0.1.0
    profiles: ["phase8-failure"]
    build:
      context: ..
      dockerfile: deployment/Dockerfile.fault-lab
    entrypoint: ["python", "-m", "fault_lab.release.fixture_init"]
    command: []
    restart: "no"
    environment:
      PHASE8_FIXTURE_ROOT: /fixtures
    volumes:
      - type: bind
        source: ./agent-input/current/observability.jsonl
        target: /seed/observability.jsonl
        read_only: true
      - type: bind
        source: ./topology/sample-compose-topology.json
        target: /seed/topology.json
        read_only: true
      - type: bind
        source: ../sample-system/order-service/src/main/resources/application.properties
        target: /seed/application.properties
        read_only: true
      - type: bind
        source: ../sample-system
        target: /seed/code-snapshot
        read_only: true
      - type: volume
        source: phase8-failure-fixtures
        target: /fixtures
    networks: [opspilot-backend]

  phase8-response-proxy:
    image: opspilot-fault-lab:0.1.0
    profiles: ["phase8-failure"]
    build:
      context: ..
      dockerfile: deployment/Dockerfile.fault-lab
    entrypoint: ["python", "-m", "fault_lab.release.response_proxy"]
    command: []
    restart: unless-stopped
    environment:
      PHASE8_RESPONSE_CONTROL_PORT: "18000"
      PHASE8_RESPONSE_ROUTES: >-
        {"18001":{"routeId":"deepseek-chat","upstream":"https://api.deepseek.com"},"18002":{"routeId":"infinity-embedding","upstream":"http://retrieval-inference:7997"},"18003":{"routeId":"infinity-rerank","upstream":"http://retrieval-inference:7997"},"18004":{"routeId":"evidence-agent-a2a","upstream":"http://evidence-agent:8081"},"18005":{"routeId":"code-agent-a2a","upstream":"http://code-agent:8082"},"18006":{"routeId":"knowledge-agent-a2a","upstream":"http://knowledge-agent:8083"},"18007":{"routeId":"diagnosis-agent-a2a","upstream":"http://diagnosis-agent:8084"},"18008":{"routeId":"remediation-agent-a2a","upstream":"http://remediation-agent:8085"},"18009":{"routeId":"prometheus-http","upstream":"http://prometheus:9090"},"18010":{"routeId":"jaeger-v1-http","upstream":"http://jaeger-v1:16686"},"18011":{"routeId":"sample-gateway-health","upstream":"http://sample-gateway:8080"},"18012":{"routeId":"jaeger-v2-http","upstream":"http://jaeger-v2:16686"},"18013":{"routeId":"inventory-actuator-health","upstream":"http://inventory-service:8080"}}
    expose: ["18000", "18001", "18002", "18003", "18004", "18005", "18006", "18007", "18008", "18009", "18010", "18011", "18012", "18013"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18000/health', timeout=2).read()"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [opspilot-backend, opspilot-provider-egress]

  toxiproxy:
    profiles: ["phase8-failure"]
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.phase8.json"]
    volumes:
      - type: bind
        source: ./toxiproxy/toxiproxy.phase8.json
        target: /config/toxiproxy.phase8.json
        read_only: true
    expose: ["8474", "8666", "8701", "8702", "8703", "8704", "8705", "8706", "8707", "8708", "8709", "8710", "8711", "8712", "8713", "8714"]
    depends_on:
      phase8-response-proxy:
        condition: service_healthy

  opspilot-server:
    environment:
      CHAT_MODEL_BASE_URL: http://toxiproxy:8701
      EMBEDDING_BASE_URL: http://toxiproxy:8702
      RERANK_BASE_URL: http://toxiproxy:8703
      READINESS_URLS: http://toxiproxy:8704/.well-known/agent-card.json,http://toxiproxy:8705/.well-known/agent-card.json,http://toxiproxy:8706/.well-known/agent-card.json,http://toxiproxy:8707/.well-known/agent-card.json,http://toxiproxy:8708/.well-known/agent-card.json
    volumes:
      - type: bind
        source: ./agents/agent-directory.phase8.yaml
        target: /app/config/agent-directory.yaml
        read_only: true

  evidence-agent:
    environment:
      CHAT_MODEL_BASE_URL: http://toxiproxy:8701
      A2A_BASE_URL: http://toxiproxy:8704
      SOURCE_PATH: /phase8-fixtures/agent-input/current/observability.jsonl
      PROMETHEUS_URL: http://toxiproxy:8709
      JAEGER_V1_URL: http://toxiproxy:8710
      JAEGER_V2_URL: http://toxiproxy:8713
      SAMPLE_GATEWAY_URL: http://toxiproxy:8711
      INVENTORY_ACTUATOR_URL: http://toxiproxy:8714
      TOPOLOGY_PATH: /phase8-fixtures/topology/sample-compose-topology.json
      CONFIG_PATH: /phase8-fixtures/source-fixtures/application.properties
    volumes:
      - type: bind
        source: ./agents/agent-directory.phase8.yaml
        target: /app/config/agent-directory.yaml
        read_only: true
      - type: volume
        source: phase8-failure-fixtures
        target: /phase8-fixtures
        read_only: true
    depends_on:
      phase8-fixture-init:
        condition: service_completed_successfully

  code-agent:
    environment:
      CHAT_MODEL_BASE_URL: http://toxiproxy:8701
      A2A_BASE_URL: http://toxiproxy:8705
      CODE_SOURCE_PATH: /phase8-fixtures/code-snapshot/sample-system
    volumes:
      - type: bind
        source: ./agents/agent-directory.phase8.yaml
        target: /app/config/agent-directory.yaml
        read_only: true
      - type: volume
        source: phase8-failure-fixtures
        target: /phase8-fixtures
        read_only: true
    depends_on:
      phase8-fixture-init:
        condition: service_completed_successfully

  knowledge-agent:
    environment:
      CHAT_MODEL_BASE_URL: http://toxiproxy:8701
      EMBEDDING_BASE_URL: http://toxiproxy:8702
      RERANK_BASE_URL: http://toxiproxy:8703
      A2A_BASE_URL: http://toxiproxy:8706
      JDBC_URL: jdbc:postgresql://toxiproxy:8712/opspilot
    volumes:
      - type: bind
        source: ./agents/agent-directory.phase8.yaml
        target: /app/config/agent-directory.yaml
        read_only: true

  diagnosis-agent:
    environment:
      CHAT_MODEL_BASE_URL: http://toxiproxy:8701
      A2A_BASE_URL: http://toxiproxy:8707
    volumes:
      - type: bind
        source: ./agents/agent-directory.phase8.yaml
        target: /app/config/agent-directory.yaml
        read_only: true

  remediation-agent:
    environment:
      CHAT_MODEL_BASE_URL: http://toxiproxy:8701
      A2A_BASE_URL: http://toxiproxy:8708
      MAVEN_SANDBOX_COMMAND: /phase8-fixtures/process/maven-sandbox/run
    volumes:
      - type: bind
        source: ./agents/agent-directory.phase8.yaml
        target: /app/config/agent-directory.yaml
        read_only: true
      - type: volume
        source: phase8-failure-fixtures
        target: /phase8-fixtures
        read_only: true
    depends_on:
      phase8-fixture-init:
        condition: service_completed_successfully

  fault-lab:
    environment:
      PROMETHEUS_URL: http://toxiproxy:8709
      JAEGER_URL: http://toxiproxy:8710
      SAMPLE_GATEWAY_URL: http://toxiproxy:8711
      JDBC_URL: jdbc:postgresql://toxiproxy:8712/opspilot
      PHASE8_RESPONSE_PROXY_URL: http://phase8-response-proxy:18000
      PHASE8_FIXTURE_ROOT: /phase8-fixtures
    volumes:
      - type: volume
        source: phase8-failure-fixtures
        target: /phase8-fixtures
    depends_on:
      phase8-fixture-init:
        condition: service_completed_successfully
      phase8-response-proxy:
        condition: service_healthy
      toxiproxy:
        condition: service_healthy

volumes:
  phase8-failure-fixtures:
