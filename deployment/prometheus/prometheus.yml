global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: sample-gateway
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["sample-gateway:8080"]}]
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["order-service:8080"]}]
  - job_name: inventory-service
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["inventory-service:8080"]}]
  - job_name: otel-collector
    static_configs: [{targets: ["otel-collector:8888"]}]
