schemaVersion: 1.0.0
scenarioId: service-instance-stopped-inventory
scenarioVersion: 1.0.0
seed: 103
timeouts: {totalSeconds: 360, recoverySeconds: 90}
baseline:
  durationSeconds: 60
  predicates:
    - {field: inventory.readiness, operator: EQ, value: UP}
    - {field: gateway.success_rate, operator: GTE, value: 0.99}
injection:
  type: CONTAINER_STOP
  target: inventory-service
  parameters: {remove_volume: false}
  durationSeconds: 90
load:
  requestsPerSecond: 5
  durationSeconds: 240
  endpoints: [/api/orders, /api/inventory/SKU-001]
collection: {logs: true, metrics: true, traces: true, configs: true}
recovery:
  durationSeconds: 90
  predicates:
    - {field: inventory.readiness, operator: EQ, value: UP}
    - {field: gateway.success_rate, operator: GTE, value: 0.99}
groundTruthRef: ../ground-truth/service-instance-stopped-inventory.json
