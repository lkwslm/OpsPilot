<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">OpsPilot 目标架构主链路</title>
  <desc id="desc">故障现场和可观测数据进入 Supervisor，由专业 Agent 基于证据、知识和受控工具完成调查，最终输出结构化 RCA 与修复建议。</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .title { font: 700 27px Inter, "Segoe UI", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 14px Inter, "Segoe UI", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .step { font: 700 12px Inter, "Segoe UI", "Microsoft YaHei", sans-serif; letter-spacing: 1.4px; }
      .card-title { font: 700 20px Inter, "Segoe UI", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .card-main { font: 600 15px Inter, "Segoe UI", "Microsoft YaHei", sans-serif; fill: #334155; }
      .card-note { font: 400 13px Inter, "Segoe UI", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .foundation-title { font: 700 14px Inter, "Segoe UI", "Microsoft YaHei", sans-serif; fill: #312e81; }
      .foundation-text { font: 500 13px Inter, "Segoe UI", "Microsoft YaHei", sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1200" height="440" rx="24" fill="#f8fafc"/>
  <rect x="42" y="34" width="8" height="54" rx="4" fill="url(#header)"/>
  <text x="70" y="58" class="title">OpsPilot 诊断闭环</text>
  <text x="70" y="82" class="subtitle">Evidence-driven · Multi-Agent · Auditable</text>
  <rect x="988" y="42" width="170" height="34" rx="17" fill="#eef2ff"/>
  <circle cx="1010" cy="59" r="5" fill="#4f46e5"/>
  <text x="1023" y="64" class="card-note" fill="#4338ca">目标架构主链路</text>

  <g filter="url(#shadow)">
    <rect x="42" y="124" width="238" height="190" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="316" y="124" width="238" height="190" rx="18" fill="#ffffff" stroke="#c7d2fe"/>
    <rect x="590" y="124" width="286" height="190" rx="18" fill="#ffffff" stroke="#bae6fd"/>
    <rect x="912" y="124" width="246" height="190" rx="18" fill="#ffffff" stroke="#ddd6fe"/>
  </g>

  <text x="66" y="154" class="step" fill="#0284c7">01 · INPUT</text>
  <text x="66" y="188" class="card-title">故障现场</text>
  <rect x="66" y="211" width="190" height="36" rx="9" fill="#f0f9ff"/>
  <text x="82" y="234" class="card-main">Incident Ticket</text>
  <text x="66" y="271" class="card-note">Logs · Metrics · Traces</text>
  <text x="66" y="294" class="card-note">Health · Topology · Config</text>

  <text x="340" y="154" class="step" fill="#4f46e5">02 · ORCHESTRATE</text>
  <text x="340" y="188" class="card-title">Supervisor Agent</text>
  <rect x="340" y="211" width="190" height="36" rx="9" fill="#eef2ff"/>
  <text x="356" y="234" class="card-main">调查计划与 A2A 委派</text>
  <text x="340" y="271" class="card-note">能力发现 · Token / Deadline</text>
  <text x="340" y="294" class="card-note">Checkpoint · Recovery · Audit</text>

  <text x="614" y="154" class="step" fill="#0891b2">03 · INVESTIGATE</text>
  <text x="614" y="188" class="card-title">专业 Agents</text>
  <rect x="614" y="211" width="112" height="32" rx="16" fill="#ecfeff"/>
  <rect x="736" y="211" width="116" height="32" rx="16" fill="#f0f9ff"/>
  <text x="638" y="232" class="card-main">Evidence</text>
  <text x="759" y="232" class="card-main">Code</text>
  <rect x="614" y="253" width="112" height="32" rx="16" fill="#faf5ff"/>
  <rect x="736" y="253" width="116" height="32" rx="16" fill="#fff7ed"/>
  <text x="632" y="274" class="card-main">Knowledge</text>
  <text x="748" y="274" class="card-main">Diagnosis</text>
  <text x="614" y="305" class="card-note">Remediation 生成受控修复建议</text>

  <text x="936" y="154" class="step" fill="#7c3aed">04 · OUTPUT</text>
  <text x="936" y="188" class="card-title">可追溯诊断</text>
  <rect x="936" y="211" width="198" height="36" rx="9" fill="#f5f3ff"/>
  <text x="952" y="234" class="card-main">Structured RCA</text>
  <text x="936" y="271" class="card-note">多根因假设 · 证据引用</text>
  <text x="936" y="294" class="card-note">止血与长期修复建议</text>

  <line x1="284" y1="219" x2="306" y2="219" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="558" y1="219" x2="580" y2="219" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="880" y1="219" x2="902" y2="219" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="42" y="342" width="1116" height="64" rx="16" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="66" y="370" class="foundation-title">可信运行基础</text>
  <text x="66" y="392" class="foundation-text">A2A 1.0 协作</text>
  <circle cx="194" cy="388" r="3" fill="#818cf8"/>
  <text x="208" y="392" class="foundation-text">AgentScope Java</text>
  <circle cx="347" cy="388" r="3" fill="#818cf8"/>
  <text x="361" y="392" class="foundation-text">Evidence + 受控工具</text>
  <circle cx="534" cy="388" r="3" fill="#818cf8"/>
  <text x="548" y="392" class="foundation-text">PostgreSQL / pgvector</text>
  <circle cx="757" cy="388" r="3" fill="#818cf8"/>
  <text x="771" y="392" class="foundation-text">OpenTelemetry</text>
  <circle cx="917" cy="388" r="3" fill="#818cf8"/>
  <text x="931" y="392" class="foundation-text">审计 · SSE · 可恢复状态</text>
</svg>
