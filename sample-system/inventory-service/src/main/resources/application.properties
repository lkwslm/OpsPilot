spring.application.name=inventory-service
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/opspilot?currentSchema=sample}
spring.datasource.username=${DB_USERNAME:sample_app_login}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.pool-name=inventory-pool
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.service=inventory-service
logging.structured.format.console=ecs
spring.jackson.time-zone=UTC
