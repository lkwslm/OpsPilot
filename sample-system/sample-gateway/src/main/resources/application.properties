spring.application.name=sample-gateway
server.port=8080
sample.order-base-url=${ORDER_BASE_URL:http://order-service:8080}
sample.inventory-base-url=${INVENTORY_BASE_URL:http://toxiproxy:8666}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.service=sample-gateway
logging.structured.format.console=ecs
spring.jackson.time-zone=UTC
