name: Security gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Scan repository and workflow boundaries
        run: python scripts/security/scan_repository.py --root . --report outputs/phase0/01-WP10/01-WP10.T05-security-report.json
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-security
          path: outputs/phase0/01-WP10/01-WP10.T05-security-report.json
          if-no-files-found: error
          retention-days: 14
