[project]
name = "opspilot-fault-lab"
version = "0.1.0"
description = "OpsPilot 可复现故障实验运行器"
requires-python = ">=3.11"
dependencies = [
  "jsonschema[format]>=4.25.1,<5",
  "psycopg[binary]>=3.2.9,<4",
  "PyYAML>=6.0.2,<7",
]

[project.scripts]
fault-lab = "fault_lab.cli:main"

[dependency-groups]
dev = ["pytest>=8.3.2,<9"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fault_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
